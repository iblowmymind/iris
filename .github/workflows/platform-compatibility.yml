name: Platform compatibility

on:
  push:
    branches: [main, mac-changes]
  pull_request:
    branches: [main, mac-changes]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang libclang-dev libasound2-dev libv4l-dev libpcap-dev
      - name: Install Windows PCAP SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP 'npcap-sdk'
          $archive = Join-Path $env:RUNNER_TEMP 'npcap-sdk.zip'
          Invoke-WebRequest https://npcap.com/dist/npcap-sdk-1.16.zip -OutFile $archive
          Expand-Archive $archive -DestinationPath $sdk
          "LIBPCAP_LIBDIR=$sdk/Lib/x64" >> $env:GITHUB_ENV
          "LIBPCAP_VER=1.9.1" >> $env:GITHUB_ENV
      - name: Check default workspace
        run: cargo check --workspace --locked
      - name: Check Lightning and JIT v2
        run: cargo check --workspace --locked --features lightning,jitv2,rex-jit
      - name: Check PCAP
        run: cargo check -p iris-gui --locked --features pcap,iris/lightning,iris/jitv2
      - name: Test GUI
        run: cargo test -p iris-gui --locked
      - name: Test DNS
        run: cargo test --lib --locked dns
